<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AI Diet Planner</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

* {
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at center, #ffecd2 0%, #fcb69f 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #3a1c1c;
  padding: 20px;
}

.container {
  width: 420px;
  padding: 35px 40px;
  border-radius: 25px;
  background: rgba(255, 255, 255, 0.85);
  box-shadow: 0 15px 40px rgba(252, 182, 159, 0.5);
  animation: fadeIn 1s ease;
  border: 2px solid #fcb69f;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  text-align: center;
  margin-bottom: 28px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #d44e1e;
  text-shadow: 1px 1px 3px #ff8a50;
}

label {
  font-size: 14px;
  opacity: 0.85;
  font-weight: 600;
  color: #6e3b24;
}

input,
select {
  width: 100%;
  padding: 14px 15px;
  margin-top: 8px;
  margin-bottom: 20px;
  border-radius: 12px;
  border: 1.8px solid #fcb69f;
  outline: none;
  background: #fff6f0;
  color: #6e3b24;
  font-size: 15px;
  font-weight: 500;
  transition: border-color 0.3s ease;
}

input::placeholder {
  color: #bc8f7a;
}

input:focus,
select:focus {
  border-color: #d44e1e;
  box-shadow: 0 0 8px #fcb69f99;
}

select option {
  color: #432a1a;
  font-weight: 500;
}

button {
  width: 100%;
  padding: 16px;
  border-radius: 40px;
  border: none;
  background: linear-gradient(135deg, #d44e1e, #fcb69f);
  color: #fff9f7;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 20px #d44e1e88;
  transition: background 0.4s ease, transform 0.3s ease;
  letter-spacing: 1.2px;
}

button:hover {
  background: linear-gradient(135deg, #fcb69f, #d44e1e);
  transform: scale(1.08);
  box-shadow: 0 10px 30px #fcb69fbb;
}

#result {
  margin-top: 25px;
  padding: 18px;
  border-radius: 15px;
  background: #f0eae2;
  font-size: 16px;
  color: #6e3b24;
  white-space: pre-wrap;
  line-height: 1.75;
  box-shadow: inset 0 0 15px #fcb69f88;
  animation: fadeIn 0.8s ease;
  min-height: 80px;
  font-weight: 500;
}
</style>
</head>

<body>

<div class="container">
  <h1>🥗 AI Diet Planner</h1>

  <label for="age">Age</label>
  <input id="age" placeholder="Enter your age" type="number" min="0" max="120" />

  <label for="height">Height (cm)</label>
  <input id="height" placeholder="Enter height" type="number" min="30" max="250" />

  <label for="weight">Weight (kg)</label>
  <input id="weight" placeholder="Enter weight" type="number" min="10" max="300" />

  <label for="goal">Goal</label>
  <select id="goal">
    <option>Weight Loss</option>
    <option>Muscle Gain</option>
    <option>Stay Fit</option>
  </select>

  <button onclick="generate()">Generate AI Diet</button>

  <div id="result"></div>
</div>

<script>
function generate() {
  fetch("http://127.0.0.1:5000/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      age: age.value,
      height: height.value,
      weight: weight.value,
      goal: goal.value,
    }),
  })
    .then((res) => res.json())
    .then((data) => {
      document.getElementById("result").innerText = data.result;
    })
    .catch(() => {
      document.getElementById("result").innerText =
        "Failed to fetch AI diet plan. Please check your connection.";
    });
}
</script>

</body>
</html>

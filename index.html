<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Diet Planner</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#001f3f,#00e5ff);
  overflow:hidden;
  padding:20px;
}

.container{
  width:430px;
  padding:35px;
  border-radius:25px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,0.3);
  box-shadow:0 10px 40px rgba(0,229,255,0.4);
  animation:fadeIn 1s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

h1{
  text-align:center;
  margin-bottom:30px;
  color:white;
  letter-spacing:2px;
  font-size:32px;
  text-shadow:0 0 10px #00e5ff;
}

label{
  color:#ffffff;
  font-size:14px;
  font-weight:600;
}

input,
select{
  width:100%;
  padding:14px;
  margin-top:8px;
  margin-bottom:20px;
  border:none;
  border-radius:14px;
  outline:none;
  background:rgba(255,255,255,0.2);
  color:white;
  font-size:15px;
  border:1px solid rgba(255,255,255,0.2);
  transition:0.3s;
}

input::placeholder{
  color:#d6faff;
}

input:focus,
select:focus{
  border:1px solid #00e5ff;
  box-shadow:0 0 15px #00e5ff;
}

select option{
  color:black;
}

button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:40px;
  background:linear-gradient(135deg,#00e5ff,#0077ff);
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  transition:0.4s;
  box-shadow:0 0 20px rgba(0,229,255,0.5);
}

button:hover{
  transform:scale(1.05);
  box-shadow:0 0 30px rgba(0,229,255,0.9);
}

#result{
  margin-top:25px;
  padding:20px;
  border-radius:18px;
  background:rgba(255,255,255,0.15);
  color:white;
  line-height:1.8;
  white-space:pre-wrap;
  min-height:80px;
  animation:fadeIn 0.8s ease;
  box-shadow:inset 0 0 15px rgba(255,255,255,0.2);
}
</style>
</head>

<body>

<div class="container">

<h1>🥗 AI Diet Planner</h1>

<label>Age</label>
<input type="number" id="age" placeholder="Enter your age">

<label>Height (cm)</label>
<input type="number" id="height" placeholder="Enter your height">

<label>Weight (kg)</label>
<input type="number" id="weight" placeholder="Enter your weight">

<label>Goal</label>
<select id="goal">
  <option>Weight Loss</option>
  <option>Muscle Gain</option>
  <option>Stay Fit</option>
</select>

<button onclick="generate()">Generate AI Diet</button>

<div id="result"></div>

</div>

<script>

function generate(){

  let age = document.getElementById("age").value;
  let height = document.getElementById("height").value;
  let weight = document.getElementById("weight").value;
  let goal = document.getElementById("goal").value;

  if(age==="" || height==="" || weight===""){
    alert("Please fill all details");
    return;
  }

  let bmi = (weight / ((height/100)*(height/100))).toFixed(1);

  let result = "";

  if(goal === "Weight Loss"){

    result =
`🔥 Goal: Weight Loss

📊 BMI: ${bmi}

🥗 Morning:
Oats + Green Tea

🍎 Snacks:
Apple / Fruits

🍛 Lunch:
Rice + Dal + Vegetables

🥜 Evening:
Dry Fruits + Juice

🍲 Dinner:
Salad + Soup

💧 Drink 3L Water
🏃 Exercise Daily`;

  }

  else if(goal === "Muscle Gain"){

    result =
`💪 Goal: Muscle Gain

📊 BMI: ${bmi}

🥚 Morning:
Eggs + Milk + Banana

🍌 Snacks:
Protein Shake

🍗 Lunch:
Chicken + Rice

🥜 Evening:
Dry Fruits

🍛 Dinner:
Paneer + Chapati

🏋️ Gym Daily
💧 Drink More Water`;

  }

  else{

    result =
`Goal: Stay Fit

📊 BMI: ${bmi}

🥗 Eat Healthy Food
🍎 Eat Fruits Daily
🏃 Walk 20 Minutes
💧 Drink Enough Water
😴 Sleep 8 Hours`;

  }

  document.getElementById("result").innerText = result;
}

</script>

</body>
</html>
